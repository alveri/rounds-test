name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: competitorpulse
          POSTGRES_PASSWORD: competitorpulse
          POSTGRES_DB: competitorpulse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U competitorpulse -d competitorpulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # One test starts mock-llm-server.py; python3 is preinstalled on the runner.
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/e2e-smoke.py
